services:
  web:
    build: .
    command: >
      sh -c "if [ ! -f .env ]; then cp .env.example .env; fi &&
             python manage.py migrate &&
             python manage.py loaddata full_data.json &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True